<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>NAWEMEDIA — Lower Thirds</title>
    <script src="./vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #05070d;
      }
      :root {
        --bg: #05070d;
        --bg-glass: rgba(16, 19, 34, 0.85);
        --border-md: rgba(255, 255, 255, 0.1);
        --text: #f1f5f9;
        --text-mut: #8b95aa;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        container-type: size;
        background: var(--bg);
        overflow: hidden;
      }
      #scene {
        position: relative;
        width: 100%;
        height: 100%;
      }

      /* ── background: ghost brand triangle + one glow, moody b-roll stand-in ── */
      #ghost-mark {
        position: absolute;
        right: -8cqw;
        top: -14cqh;
        width: 58cqw;
        height: 58cqw;
        opacity: 0.06;
      }
      #glow {
        position: absolute;
        width: 60cqw;
        height: 60cqw;
        right: -20cqw;
        top: -10cqh;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(123, 97, 255, 0.14) 0%, rgba(0, 0, 0, 0) 70%);
        pointer-events: none;
      }

      #corner-mark {
        position: absolute;
        top: 3.6cqw;
        left: 8.3cqw;
        width: 2.4cqw;
        height: 2.9cqw;
        opacity: 0;
        z-index: 10;
      }
      #corner-label {
        position: absolute;
        top: 3.9cqw;
        left: 11.2cqw;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-mut);
        opacity: 0;
      }

      /* ── lower-third: left-anchored, bottom third of frame ── */
      #lt {
        position: absolute;
        left: 8.3cqw;
        bottom: 10cqh;
        display: flex;
        align-items: stretch;
        background: var(--bg-glass);
        border: 0.1cqw solid var(--border-md);
        border-radius: 0.52cqw;
        overflow: hidden;
        transform: scaleX(0);
        transform-origin: left center;
      }
      #lt-accent {
        width: 0.3cqw;
        min-width: 4px;
        background: var(--accent, #ff2d95);
      }
      #lt-text {
        padding: 1.1cqw 2.2cqw;
        min-width: 26cqw;
      }
      #lt-name {
        font-family: "League Gothic", sans-serif;
        font-weight: 400;
        font-size: 3.4cqw;
        line-height: 1;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        color: var(--text);
      }
      #lt-tag {
        margin-top: 0.5cqw;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-mut);
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="lower-thirds"
      data-start="0"
      data-duration="8"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div id="glow"></div>
        <svg id="ghost-mark" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#FF2D95" />
              <stop offset="45%" stop-color="#FF5C39" />
              <stop offset="100%" stop-color="#FFC300" />
            </linearGradient>
          </defs>
          <polygon points="155,110 245,150 155,190" fill="url(#ghostGrad)" />
        </svg>

        <svg id="corner-mark" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#FF2D95" />
              <stop offset="45%" stop-color="#FF5C39" />
              <stop offset="100%" stop-color="#FFC300" />
            </linearGradient>
          </defs>
          <polygon points="155,110 245,150 155,190" fill="url(#markGrad)" />
        </svg>
        <p id="corner-label">Nawemedia — Clientes</p>

        <div id="lt">
          <div id="lt-accent"></div>
          <div id="lt-text" data-layout-allow-overflow="true">
            <div id="lt-name"></div>
            <div id="lt-tag"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.to("#glow", { scale: 1.08, duration: 5.6, repeat: -1, yoyo: true, ease: "sine.inOut" }, 0);
      tl.to("#ghost-mark", { rotation: 5, duration: 10, repeat: -1, yoyo: true, ease: "sine.inOut" }, 0);
      gsap.set("#ghost-mark", { transformOrigin: "60% 50%" });

      tl.fromTo(
        "#corner-mark",
        { autoAlpha: 0, scale: 0.6 },
        { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(2)" },
        0.1,
      );
      tl.fromTo(
        "#corner-label",
        { autoAlpha: 0, x: -10 },
        { autoAlpha: 1, x: 0, duration: 0.3, ease: "power2.out" },
        0.2,
      );

      // ── bar slides in once; the six real EPK clients cycle inside it ──
      tl.fromTo("#lt", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 0.4);

      var NAMES = [
        { name: "Ambar Lombardi", accent: "#FF2D95" },
        { name: "YEMIX", accent: "#FF5C39" },
        { name: "DJ BINI", accent: "#FFC300" },
        { name: "DJ Fay", accent: "#7B61FF" },
        { name: "DJ Mario Beckam", accent: "#00E5FF" },
        { name: "DJ Elektra", accent: "#FF7A00" },
      ];
      var TAG = "EPK · NAWEMEDIA";
      var nameEl = document.getElementById("lt-name");
      var tagEl = document.getElementById("lt-tag");
      var accentEl = document.getElementById("lt-accent");

      var SLOT = 1.15; // seconds per client
      var START = 0.85;

      NAMES.forEach(function (client, i) {
        var t = START + i * SLOT;
        tl.call(
          function () {
            nameEl.textContent = client.name;
            tagEl.textContent = TAG;
            accentEl.style.background = client.accent;
          },
          null,
          t,
        );
        tl.fromTo(
          "#lt-text",
          { autoAlpha: 0, y: 10 },
          { autoAlpha: 1, y: 0, duration: 0.22, ease: "power2.out" },
          t,
        );
        if (i < NAMES.length - 1) {
          tl.to("#lt-text", { autoAlpha: 0, y: -10, duration: 0.18, ease: "power1.in" }, t + SLOT - 0.2);
        }
      });

      tl.seek(0);
      window.__timelines["lower-thirds"] = tl;
    </script>
  </body>
</html>
