<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>NAWEMEDIA — Transition: Flash (retinted)</title>
    <script src="./vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #05070d;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: #05070d;
        overflow: hidden;
      }
      #tex-a,
      #tex-b {
        display: none;
      }
      #gl-canvas {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="transition-flash"
      data-start="0"
      data-duration="4"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <!-- real rendered end-frames of piece 1 (hero) and piece 2 (service-reveal) -->
        <img id="tex-a" src="./assets/scene-a-hero.png" alt="" />
        <img id="tex-b" src="./assets/scene-b-services.png" alt="" />
        <canvas id="gl-canvas" width="1920" height="1080"></canvas>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      (function () {
        var canvas = document.getElementById("gl-canvas");
        var gl = canvas.getContext("webgl", { preserveDrawingBuffer: true });
        if (!gl) {
          console.warn("WebGL not available");
          window.__timelines["transition-flash"] = gsap.timeline({ paused: true });
          return;
        }
        gl.viewport(0, 0, 1920, 1080);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

        var vertSrc =
          "attribute vec2 a_pos; varying vec2 v_uv; void main(){" +
          "v_uv=a_pos*0.5+0.5; gl_Position=vec4(a_pos,0,1);}";

        var H =
          "precision mediump float;" +
          "varying vec2 v_uv;" +
          "uniform sampler2D u_from, u_to;" +
          "uniform float u_progress;\n";

        // ── retinted flash: brand pale-magenta peak instead of pure white ──
        // frame.md transition-flash: "tint: {colors.magenta} at flash peak instead of pure white"
        var FLASH_TINT = "vec3(1.0, 0.86, 0.94)"; // pale magenta-white, not #fff

        var fragPass = H + "void main(){gl_FragColor=texture2D(u_from,v_uv);}";
        var fragTrans =
          H +
          "void main(){" +
          "vec4 A=texture2D(u_from,v_uv);" +
          "vec4 B=texture2D(u_to,v_uv);" +
          "float toFlash=smoothstep(0.,.45,u_progress);" +
          "vec3 fromC=mix(A.rgb," +
          FLASH_TINT +
          ",toFlash);" +
          "float fromFlash=1.-smoothstep(.5,1.,u_progress);" +
          "vec3 toC=mix(B.rgb," +
          FLASH_TINT +
          ",fromFlash);" +
          "gl_FragColor=vec4(mix(fromC,toC,smoothstep(.35,.65,u_progress)),1.);" +
          "}";

        function compileShader(src, type) {
          var s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error("Shader:", gl.getShaderInfoLog(s));
          return s;
        }
        function mkProg(fragSrc) {
          var p = gl.createProgram();
          gl.attachShader(p, compileShader(vertSrc, gl.VERTEX_SHADER));
          gl.attachShader(p, compileShader(fragSrc, gl.FRAGMENT_SHADER));
          gl.linkProgram(p);
          if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error("Link:", gl.getProgramInfoLog(p));
          return p;
        }

        var quadBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

        var progPass = mkProg(fragPass);
        var progTrans = mkProg(fragTrans);

        function makeTexture(img) {
          var tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
          return tex;
        }

        function renderShader(prog, texFrom, texTo, progress) {
          gl.useProgram(prog);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, texFrom);
          gl.uniform1i(gl.getUniformLocation(prog, "u_from"), 0);
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, texTo);
          gl.uniform1i(gl.getUniformLocation(prog, "u_to"), 1);
          gl.uniform1f(gl.getUniformLocation(prog, "u_progress"), progress);
          var pos = gl.getAttribLocation(prog, "a_pos");
          gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
          gl.enableVertexAttribArray(pos);
          gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        function easeInOut(p) {
          return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        }

        var imgA = document.getElementById("tex-a");
        var imgB = document.getElementById("tex-b");

        // ── real network/file image loads: decode both before building the timeline ──
        // (the reference catalog block rasterizes already-parsed DOM synchronously;
        // we load two real PNGs, so texture upload must wait for decode)
        Promise.all([imgA.decode(), imgB.decode()]).then(function () {
          var texA = makeTexture(imgA);
          var texB = makeTexture(imgB);
          renderShader(progPass, texA, texA, 0);

          var HOLD_A_END = 1.1;
          var TRANS_END = 2.3;

          var tl = gsap.timeline({
            paused: true,
            onUpdate: function () {
              var t = tl.time();
              if (t < HOLD_A_END) {
                renderShader(progPass, texA, texA, 0);
              } else if (t < TRANS_END) {
                renderShader(progTrans, texA, texB, easeInOut((t - HOLD_A_END) / (TRANS_END - HOLD_A_END)));
              } else {
                renderShader(progPass, texB, texB, 0);
              }
            },
          });
          tl.to({ v: 0 }, { v: 1, duration: 4, ease: "none" }, 0);
          tl.seek(0);
          window.__timelines["transition-flash"] = tl;
        });
      })();
    </script>
  </body>
</html>
